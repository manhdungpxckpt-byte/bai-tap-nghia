  <text x="20" y="30" font-size="17" font-weight="bold">So do khoi Simulink ma code &quot;code_truyen_luc_banh_xe.m&quot; TU DONG DUNG (file he_thong_truyen_luc.slx)</text>
  <text x="20" y="48" font-size="11" fill="#666">Chay code -&gt; add_block/add_line dung so do nay -&gt; sim() chay mo phong -&gt; ve 3 do thi ket qua</text>

